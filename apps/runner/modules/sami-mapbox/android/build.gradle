
plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'com.sami.runner.mapbox'
version = '1.0.0'

android {
    namespace 'com.sami.runner.mapbox'

    defaultConfig {
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Official Mapbox Maps SDK — NDK 27
    implementation 'com.mapbox.maps:android-ndk27:11.35.0'

    // Official Mapbox Navigation SDK — NDK 27
    implementation 'com.mapbox.navigationcore:android-ndk27:3.35.0'
}
