plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'com.sami.runner.mapbox'
version = '1.0.0'

android {
    namespace 'com.sami.runner.mapbox'

    defaultConfig {
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Official Mapbox Maps SDK (NDK 27 / 16 KB page-size compatible).
    implementation 'com.mapbox.maps:android-ndk27:11.35.0'

    // Official Mapbox Navigation SDK core and primary navigation session API.
    implementation 'com.mapbox.navigationcore:android-ndk27:3.35.0'
    implementation 'com.mapbox.navigationcore:navigation-ndk27:3.35.0'

    // Custom SaMi navigation UI: camera, route line, maneuvers and trip progress.
    implementation 'com.mapbox.navigationcore:ui-maps-ndk27:3.35.0'
    implementation 'com.mapbox.navigationcore:tripdata-ndk27:3.35.0'

    // Spoken turn-by-turn instructions.
    implementation 'com.mapbox.navigationcore:voice-ndk27:3.35.0'
}
