name: Temporary Next.js Security Lock Sync

on:
  push:
    branches:
      - feat/category-24-platform-administration
    paths:
      - .github/workflows/security-next-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Resolve patched framework lockfile
        run: npm install next@16.3.6 eslint-config-next@16.3.6 --save-exact --package-lock-only --ignore-scripts

      - name: Commit patched dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency graph already current."
            exit 0
          fi
          git commit -m "chore(security): upgrade Next.js to 16.3.6"
          git push origin HEAD:${GITHUB_REF_NAME}
