name: Generate SaMi app icon assets

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-sami-app-icon.py"

permissions:
  contents: write

concurrency:
  group: sami-app-icon-assets
  cancel-in-progress: false

jobs:
  generate-icons:
    name: Generate and commit launcher icon PNGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out SaMi
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate launcher and adaptive icons
        run: python scripts/generate-sami-app-icon.py

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/icon.png apps/mobile/assets/adaptive-icon.png
          if git diff --cached --quiet; then
            echo "Icon assets already match the generator; no commit needed."
            exit 0
          fi
          git commit -m "Generate SaMi customer app launcher icons"
          git push origin HEAD:main
