name: Invoicing Module Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/apps/invoicing/**'
      - 'app/api/apps/invoicing/**'
      - 'app/api/internal/invoicing/**'
      - 'app/api/public/invoicing/**'
      - 'lib/apps/invoicing/**'
      - 'lib/modules/first-party.ts'
      - 'module-quality-locks.json'
      - 'tests/invoicing-module.test.mjs'
      - 'tests/module-quality-locks.test.mjs'
      - '.github/workflows/invoicing-module.yml'
  push:
    branches:
      - main
    paths:
      - 'app/apps/invoicing/**'
      - 'app/api/apps/invoicing/**'
      - 'app/api/internal/invoicing/**'
      - 'app/api/public/invoicing/**'
      - 'lib/apps/invoicing/**'
      - 'lib/modules/first-party.ts'
      - 'module-quality-locks.json'
      - 'tests/invoicing-module.test.mjs'
      - 'tests/module-quality-locks.test.mjs'
      - '.github/workflows/invoicing-module.yml'

permissions:
  contents: read

jobs:
  invoicing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Invoicing regressions
        run: npm run test:invoicing

      - name: Quality locks
        run: npm run test:locks

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
