name: Lint Cleanup

on:
  push:
    branches:
      - fix/lint-cleanup

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx eslint . --quiet
