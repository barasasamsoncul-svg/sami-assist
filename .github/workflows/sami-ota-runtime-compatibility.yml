name: SaMi OTA runtime compatibility diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sami-ota-runtime-compatibility.yml"

permissions:
  contents: read

jobs:
  compare-production-build-and-update:
    name: Compare installed production APK with latest OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install committed mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Compare the last production APK with the published OTA update
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d"
          npx eas-cli@latest fingerprint:compare \
            --build-id 09e5ada9-513c-42c5-acbe-23ed2a69325e \
            --update-id 01a1acef-e2fc-7f66-a808-020501b97f68 \
            --json \
            --non-interactive
