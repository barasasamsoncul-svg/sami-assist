name: SaMi production Android release

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.ts"
      - "apps/mobile/eas.json"
      - "apps/mobile/package.json"
      - "apps/mobile/assets/icon.png"
      - "apps/mobile/assets/adaptive-icon.png"
      - "apps/mobile/plugins/**"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-production-android-v3
  cancel-in-progress: true

jobs:
  production-android:
    name: Validate and build production APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app
      EXPO_UPDATE_CHANNEL: production
      EXPECTED_ANDROID_SIGNING_CERT_SHA256: 591DF420FCA82C7900E5BB9B336F417C130E2F8977C9E88034EE82B47A05AB91

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Validate production release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is missing from GitHub Actions secrets." >&2; exit 1; }
          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d" || { echo "EXPO_PROJECT_ID must point to the SaMi production Expo project." >&2; exit 1; }
          node - <<'NODE'
          const fs = require("node:fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
          const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          if (app.android?.package !== "com.sami.errands") throw new Error("Unexpected production Android package ID.");
          if (app.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) throw new Error("Expo project ID does not match the production project.");
          if (eas.build?.production?.channel !== "production") throw new Error("Production build is not assigned to the production update channel.");
          if (eas.build?.production?.env?.EXPO_PUBLIC_SAMI_API_URL !== "https://sami-assist.vercel.app") throw new Error("Production profile is not using the live SaMi API.");
          if (eas.build?.production?.android?.buildType !== "apk") throw new Error("Production direct-download build must produce an APK.");
          if (!/^[A-F0-9]{64}$/.test(process.env.EXPECTED_ANDROID_SIGNING_CERT_SHA256 || "")) throw new Error("Expected production signing certificate fingerprint is missing.");
          NODE

      - name: Check Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Type-check app
        run: npm run typecheck

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-production-bundle"

      - name: Build signed production APK using existing credentials only
        shell: bash
        run: |
          set -euo pipefail
          npm install --global eas-cli@latest
          # Non-interactive mode intentionally fails if EAS credentials are missing.
          # It never accepts prompts to create or replace the production signing key.
          eas build --platform android --profile production --wait --non-interactive 2>&1 | tee "$RUNNER_TEMP/sami-production-build.log"

          BUILD_ID="$(python3 - <<'PY'
          import re
          from pathlib import Path
          import os
          log = Path(os.environ["RUNNER_TEMP"], "sami-production-build.log").read_text(errors="replace")
          matches = re.findall(r"/builds/([0-9a-fA-F-]{36})", log)
          print(matches[-1] if matches else "")
          PY
          )"
          if [[ -z "$BUILD_ID" ]]; then
            echo "EAS did not report a build ID. Review the EAS output above; no alternative key will be generated." >&2
            exit 1
          fi
          echo "Production EAS build ID: $BUILD_ID"
          eas build:download --build-id "$BUILD_ID" --non-interactive

          APK_PATH="$(find /tmp/runner/eas-cli-nodejs/eas-build-run-cache -maxdepth 3 -type f -iname '*.apk' -print -quit 2>/dev/null || true)"
          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(find . -maxdepth 5 -type f -iname '*.apk' -not -path '*/node_modules/*' -print -quit)"
          fi
          if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "The completed EAS build did not provide a downloadable APK." >&2
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android apksigner is not available; refusing to deliver an unverified APK." >&2
            exit 1
          fi
          "$APKSIGNER" verify "$APK_PATH"
          APK_FP="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1 | grep -Eo '[[:xdigit:]:]{64,95}' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$APK_FP" != "$EXPECTED_ANDROID_SIGNING_CERT_SHA256" ]]; then
            echo "The new APK signing fingerprint does not match the verified SaMi production key." >&2
            echo "Expected: $EXPECTED_ANDROID_SIGNING_CERT_SHA256" >&2
            echo "Actual:   $APK_FP" >&2
            echo "The APK will not be published as a workflow artifact." >&2
            exit 1
          fi

          cp "$APK_PATH" "$RUNNER_TEMP/SaMi-production.apk"
          echo "Production APK: $RUNNER_TEMP/SaMi-production.apk"
          echo "Build ID: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://sami-assist.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "Update channel: production" >> "$GITHUB_STEP_SUMMARY"
          echo "Android package: com.sami.errands" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified signing fingerprint: $APK_FP" >> "$GITHUB_STEP_SUMMARY"
          echo "The existing production signing key was preserved; no credential-generation fallback is used." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: sami-production-android-apk
          path: ${{ runner.temp }}/SaMi-production.apk
          if-no-files-found: error
          retention-days: 30
