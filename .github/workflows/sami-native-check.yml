name: SaMi native app checks

on:
  push:
    branches:
      - feat/sami-native-app
    paths:
      - "apps/mobile/**"
      - "database/**"
      - "lib/errand-location-schema.ts"
      - "tests/**"
      - ".github/workflows/sami-native-check.yml"
  workflow_dispatch:

concurrency:
  group: sami-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-app:
    name: Validate and build Android standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist-git-feat-sami-2bf3a4-barasasamsoncul-svgs-projects.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Type-check native app
        run: npm run typecheck

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Bundle Android app
        run: npx expo export --platform android --output-dir /tmp/sami-android-export

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone Android APK
        run: cd android && ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 :app:assembleRelease

      - name: Verify standalone APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Upload SaMi Android standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: sami-android-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
