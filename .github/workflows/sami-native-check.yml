name: SaMi production Android release

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/sami-native-check.yml"
      - ".github/workflows/sami-production-ota.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-production-android-v2
  cancel-in-progress: true

jobs:
  production-android:
    name: Validate and build production APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app
      EXPO_UPDATE_CHANNEL: production

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Validate production release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is missing from GitHub Actions secrets." >&2; exit 1; }
          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d" || { echo "EXPO_PROJECT_ID must point to the SaMi production Expo project." >&2; exit 1; }
          node - <<'NODE'
          const fs = require("node:fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
          const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          if (app.android?.package !== "com.sami.errands") throw new Error("Unexpected production Android package ID.");
          if (app.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) throw new Error("Expo project ID does not match the production project.");
          if (eas.build?.production?.channel !== "production") throw new Error("Production build is not assigned to the production update channel.");
          if (eas.build?.production?.env?.EXPO_PUBLIC_SAMI_API_URL !== "https://sami-assist.vercel.app") throw new Error("Production profile is not using the live SaMi API.");
          if (eas.build?.production?.android?.buildType !== "apk") throw new Error("Production direct-download build must produce an APK.");
          NODE

      - name: Check Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Type-check app
        run: npm run typecheck

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-production-bundle"

      - name: Build signed production APK using EAS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y expect
          cat > "$RUNNER_TEMP/sami-production-build.exp" <<'EXPECT'
          set timeout -1
          log_user 1
          log_file -noappend "$env(RUNNER_TEMP)/sami-production-build.log"
          spawn env CI=false npx eas-cli@latest build --platform android --profile production --wait
          expect {
            -nocase -re {generate.*keystore} { send "\r"; exp_continue }
            -nocase -re {generate new keystore} { send "\r"; exp_continue }
            -nocase -re {would you like to generate.*keystore} { send "y\r"; exp_continue }
            -nocase -re {do you want to generate.*keystore} { send "y\r"; exp_continue }
            eof {}
          }
          set result [wait]
          exit [lindex $result 3]
          EXPECT
          expect "$RUNNER_TEMP/sami-production-build.exp"

          BUILD_ID="$(python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path(__import__("os").environ["RUNNER_TEMP"], "sami-production-build.log").read_text(errors="replace")
          matches = re.findall(r"/builds/([0-9a-fA-F-]{36})", log)
          print(matches[-1] if matches else "")
          PY
          )"
          if [[ -z "$BUILD_ID" ]]; then
            echo "EAS did not report a build ID. Review the EAS output above before retrying." >&2
            exit 1
          fi
          echo "Production EAS build ID: $BUILD_ID"
          npx eas-cli@latest build:download --build-id "$BUILD_ID" --non-interactive
          APK_PATH="$(find . -maxdepth 4 -type f -iname '*.apk' -not -path '*/node_modules/*' -print -quit)"
          if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "The completed EAS build did not download an APK artifact." >&2
            exit 1
          fi
          cp "$APK_PATH" "$RUNNER_TEMP/SaMi-production.apk"
          echo "Production APK: $RUNNER_TEMP/SaMi-production.apk"
          echo "Build ID: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://sami-assist.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "Update channel: production" >> "$GITHUB_STEP_SUMMARY"
          echo "Android package: com.sami.errands" >> "$GITHUB_STEP_SUMMARY"
          echo "APK signing uses the persistent EAS-managed production key; no temporary-key fallback is allowed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: sami-production-android-apk
          path: ${{ runner.temp }}/SaMi-production.apk
          if-no-files-found: error
          retention-days: 30
