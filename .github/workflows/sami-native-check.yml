name: SaMi shared native Android releases

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.ts"
      - "apps/mobile/eas.json"
      - "apps/mobile/package.json"
      - "apps/mobile/package-lock.json"
      - "apps/mobile/assets/icon.png"
      - "apps/mobile/assets/adaptive-icon.png"
      - "apps/mobile/assets/sami-app-icon-1024.png"
      - "apps/mobile/assets/sami-splash-logo-1024.png"
      - "apps/mobile/plugins/**"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
      - "apps/runner/app.json"
      - "apps/runner/eas.json"
      - "apps/runner/package.json"
      - "apps/runner/package-lock.json"
      - "apps/runner/assets/icon.png"
      - "apps/runner/assets/adaptive-icon.png"
      - "apps/runner/plugins/**"
      - "apps/runner/android/**"
      - "apps/runner/ios/**"
      - ".github/workflows/sami-native-check.yml"

  workflow_dispatch:
    inputs:
      app:
        description: Select the app to build
        type: choice
        required: true
        default: both
        options:
          - customer
          - runner
          - both

permissions:
  contents: read

concurrency:
  group: sami-shared-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-native-changes:
    name: Detect applications requiring a new APK
    runs-on: ubuntu-latest

    outputs:
      customer_native: ${{ steps.classify.outputs.customer_native }}
      runner_native: ${{ steps.classify.outputs.runner_native }}

    steps:
      - name: Checkout complete commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify native changes
        id: classify
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          SELECTED_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail

          CUSTOMER_NATIVE=false
          RUNNER_NATIVE=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$SELECTED_APP" in
              customer)
                CUSTOMER_NATIVE=true
                ;;
              runner)
                RUNNER_NATIVE=true
                ;;
              both)
                CUSTOMER_NATIVE=true
                RUNNER_NATIVE=true
                ;;
              *)
                echo "Invalid application selection." >&2
                exit 1
                ;;
            esac
          else
            BEFORE="$EVENT_BEFORE"

            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || \
              ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "Cannot establish a safe commit comparison."
              echo "Both apps will be built to avoid missing a native change."
              CUSTOMER_NATIVE=true
              RUNNER_NATIVE=true
            else
              CHANGED_FILES="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"

              echo "Changed files:"
              printf '%s\n' "$CHANGED_FILES"

              while IFS= read -r file; do
                [[ -n "$file" ]] || continue

                case "$file" in
                  apps/mobile/app.json|\
                  apps/mobile/app.config.ts|\
                  apps/mobile/eas.json|\
                  apps/mobile/package.json|\
                  apps/mobile/package-lock.json|\
                  apps/mobile/assets/icon.png|\
                  apps/mobile/assets/adaptive-icon.png|\
                  apps/mobile/assets/sami-app-icon-1024.png|\
                  apps/mobile/assets/sami-splash-logo-1024.png|\
                  apps/mobile/plugins/*|\
                  apps/mobile/android/*|\
                  apps/mobile/ios/*)
                    CUSTOMER_NATIVE=true
                    echo "Customer APK required: $file"
                    ;;
                esac

                case "$file" in
                  apps/runner/app.json|\
                  apps/runner/eas.json|\
                  apps/runner/package.json|\
                  apps/runner/package-lock.json|\
                  apps/runner/assets/icon.png|\
                  apps/runner/assets/adaptive-icon.png|\
                  apps/runner/plugins/*|\
                  apps/runner/android/*|\
                  apps/runner/ios/*)
                    RUNNER_NATIVE=true
                    echo "Runner APK required: $file"
                    ;;
                esac
              done <<< "$CHANGED_FILES"
            fi
          fi

          echo "customer_native=$CUSTOMER_NATIVE" >> "$GITHUB_OUTPUT"
          echo "runner_native=$RUNNER_NATIVE" >> "$GITHUB_OUTPUT"

          echo "Customer APK required: $CUSTOMER_NATIVE"
          echo "Runner APK required: $RUNNER_NATIVE"

  customer-production-android:
    name: Build Customer production APK
    needs: detect-native-changes
    if: needs.detect-native-changes.outputs.customer_native == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: apps/mobile

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app
      EXPO_UPDATE_CHANNEL: production
      EXPECTED_ANDROID_SIGNING_CERT_SHA256: 591DF420FCA82C7900E5BB9B336F417C130E2F8977C9E88034EE82B47A05AB91

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Customer dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate Customer release configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EXPO_TOKEN" || {
            echo "EXPO_TOKEN is missing." >&2
            exit 1
          }

          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d" || {
            echo "Incorrect Customer Expo project ID." >&2
            exit 1
          }

          node - <<'NODE'
          const fs = require("node:fs");

          const app = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          ).expo;

          const eas = JSON.parse(
            fs.readFileSync("eas.json", "utf8")
          );

          if (app.android?.package !== "com.sami.errands") {
            throw new Error("Unexpected Customer Android package.");
          }

          if (app.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) {
            throw new Error("Customer EAS project ID mismatch.");
          }

          if (eas.build?.production?.channel !== "production") {
            throw new Error("Incorrect Customer production update channel.");
          }

          if (eas.build?.production?.environment !== "production") {
            throw new Error("Customer must use the production EAS environment.");
          }

          if (eas.build?.production?.android?.buildType !== "apk") {
            throw new Error("Customer production build must produce an APK.");
          }

          if (
            !/^[A-F0-9]{64}$/.test(
              process.env.EXPECTED_ANDROID_SIGNING_CERT_SHA256 || ""
            )
          ) {
            throw new Error("Customer signing certificate fingerprint is missing.");
          }

          console.log("Customer release identity verified.");
          NODE

      - name: Check Customer Expo dependencies
        run: npx expo install --check

      - name: Type-check Customer app
        run: npm run typecheck

      - name: Check Customer Expo project health
        run: npx expo-doctor

      - name: Export Customer Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-customer-native-check"

      - name: Load restricted Customer Google Maps key
        shell: bash
        run: |
          set -euo pipefail

          MAP_ENV_FILE="$RUNNER_TEMP/sami-customer-production.env"

          npx eas-cli@latest env:pull \
            --environment production \
            --path "$MAP_ENV_FILE" \
            --non-interactive

          node - "$MAP_ENV_FILE" "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const [envPath, githubEnv] = process.argv.slice(2);

          const line = fs.readFileSync(envPath, "utf8")
            .split(/\r?\n/)
            .find((item) => item.startsWith("GOOGLE_MAPS_API_KEY="));

          let key = line?.slice("GOOGLE_MAPS_API_KEY=".length).trim() || "";

          if (
            (key.startsWith('"') && key.endsWith('"')) ||
            (key.startsWith("'") && key.endsWith("'"))
          ) {
            key = key.slice(1, -1);
          }

          if (key.length < 20) {
            console.error("Customer Google Maps key is missing from the EAS production environment.");
            process.exit(1);
          }

          console.log("::add-mask::" + key);
          fs.appendFileSync(
            githubEnv,
            "GOOGLE_MAPS_API_KEY=" + key + "\n"
          );

          fs.unlinkSync(envPath);
          console.log("Customer Google Maps key loaded without logging its value.");
          NODE

      - name: Build Customer production APK
        shell: bash
        run: |
          set -euo pipefail

          npx eas-cli@latest build \
            --platform android \
            --profile production \
            --wait \
            --non-interactive \
            2>&1 | tee "$RUNNER_TEMP/sami-customer-build.log"

          BUILD_ID="$(
            node - "$RUNNER_TEMP/sami-customer-build.log" <<'NODE'
          const fs = require("node:fs");

          const log = fs.readFileSync(process.argv[2], "utf8");
          const matches = [...log.matchAll(/\/builds\/([0-9a-fA-F-]{36})/g)];

          process.stdout.write(matches.at(-1)?.[1] || "");
          NODE
          )"

          test -n "$BUILD_ID" || {
            echo "Customer EAS build ID was not found." >&2
            exit 1
          }

          npx eas-cli@latest build:view "$BUILD_ID" \
            --json > "$RUNNER_TEMP/sami-customer-build.json"

          node - "$RUNNER_TEMP/sami-customer-build.json" <<'NODE'
          const fs = require("node:fs");

          const raw = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          const build = raw.build || raw;

          if (String(build.status).toUpperCase() !== "FINISHED") {
            throw new Error("Customer build did not finish successfully.");
          }

          if (String(build.platform).toUpperCase() !== "ANDROID") {
            throw new Error("Customer build is not Android.");
          }

          if (build.appIdentifier !== "com.sami.errands") {
            throw new Error("Build does not belong to Customer.");
          }

          if (build.buildProfile !== "production") {
            throw new Error("Customer build is not production.");
          }

          if (!build.artifacts?.applicationArchiveUrl) {
            throw new Error("Customer APK artifact is missing.");
          }
          NODE

          npx eas-cli@latest build:download \
            --build-id "$BUILD_ID" \
            --non-interactive

          APK_PATH="$(
            find /tmp/runner/eas-cli-nodejs/eas-build-run-cache \
              -maxdepth 3 -type f -iname '*.apk' \
              -print -quit 2>/dev/null || true
          )"

          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(
              find . -maxdepth 5 -type f -iname '*.apk' \
                -not -path '*/node_modules/*' \
                -print -quit
            )"
          fi

          test -n "$APK_PATH" && test -s "$APK_PATH" || {
            echo "Customer APK download failed." >&2
            exit 1
          }

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" -name apksigner \
              -print 2>/dev/null | sort -V | tail -n 1
          )"

          test -n "$APKSIGNER" || {
            echo "Android apksigner was not found." >&2
            exit 1
          }

          "$APKSIGNER" verify "$APK_PATH"

          APK_FP="$(
            "$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1 |
            grep -Eo '[[:xdigit:]:]{64,95}' |
            head -n 1 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [[ "$APK_FP" != "$EXPECTED_ANDROID_SIGNING_CERT_SHA256" ]]; then
            echo "Customer production signing certificate mismatch." >&2
            echo "Expected: $EXPECTED_ANDROID_SIGNING_CERT_SHA256" >&2
            echo "Actual: $APK_FP" >&2
            exit 1
          fi

          cp "$APK_PATH" "$RUNNER_TEMP/SaMi-Customer-production.apk"

          echo "Customer EAS build: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Customer package: com.sami.errands" >> "$GITHUB_STEP_SUMMARY"
          echo "Customer signing certificate verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Customer production APK
        uses: actions/upload-artifact@v4
        with:
          name: sami-customer-production-apk
          path: ${{ runner.temp }}/SaMi-Customer-production.apk
          if-no-files-found: error
          retention-days: 30

  runner-production-android:
    name: Build Runner production APK
    needs: detect-native-changes
    if: needs.detect-native-changes.outputs.runner_native == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: apps/runner

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: "8fcd647e-3514-4436-b1ce-c1b417f6c1d3"
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json

      - name: Install Runner dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate dedicated Runner release configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EXPO_TOKEN" || {
            echo "EXPO_TOKEN is missing." >&2
            exit 1
          }

          npx expo config --type public --json \
            > "$RUNNER_TEMP/sami-runner-expo-config.json"

          node - "$RUNNER_TEMP/sami-runner-expo-config.json" <<'NODE'
          const fs = require("node:fs");

          const config = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          const eas = JSON.parse(
            fs.readFileSync("eas.json", "utf8")
          );

          const expectedProjectId =
            "8fcd647e-3514-4436-b1ce-c1b417f6c1d3";

          if (config.slug !== "sami-runner") {
            throw new Error("Unexpected Runner Expo slug.");
          }

          if (config.android?.package !== "com.sami.runner") {
            throw new Error("Unexpected Runner Android package.");
          }

          if (config.ios?.bundleIdentifier !== "com.sami.runner") {
            throw new Error("Unexpected Runner iOS bundle identifier.");
          }

          if (config.extra?.eas?.projectId !== expectedProjectId) {
            throw new Error("Runner Expo project ID mismatch.");
          }

          if (
            config.updates?.url !==
            "https://u.expo.dev/" + expectedProjectId
          ) {
            throw new Error("Runner EAS Updates URL mismatch.");
          }

          if (config.updates?.enabled !== true) {
            throw new Error("Runner EAS Updates are disabled.");
          }

          if (config.runtimeVersion?.policy !== "fingerprint") {
            throw new Error("Runner must use fingerprint runtime compatibility.");
          }

          if (eas.build?.production?.channel !== "runner-production") {
            throw new Error("Runner production update channel mismatch.");
          }

          if (eas.build?.production?.environment !== "production") {
            throw new Error("Runner must use the production EAS environment.");
          }

          if (eas.build?.production?.android?.buildType !== "apk") {
            throw new Error("Runner production profile must produce an APK.");
          }

          console.log("Runner Expo project verified.");
          console.log("Runner package: com.sami.runner");
          console.log("Runner channel: runner-production");
          console.log("Runner runtime policy: fingerprint");
          NODE

      - name: Check Runner Expo dependencies
        run: npx expo install --check

      - name: Type-check Runner
        run: npm run typecheck

      - name: Check Runner Expo project health
        run: npx expo-doctor

      - name: Export Runner Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-runner-native-check"

      - name: Build Runner production APK
        shell: bash
        run: |
          set -euo pipefail

          npx eas-cli@latest build \
            --platform android \
            --profile production \
            --wait \
            --non-interactive \
            2>&1 | tee "$RUNNER_TEMP/sami-runner-build.log"

          BUILD_ID="$(
            node - "$RUNNER_TEMP/sami-runner-build.log" <<'NODE'
          const fs = require("node:fs");

          const log = fs.readFileSync(process.argv[2], "utf8");
          const matches = [...log.matchAll(/\/builds\/([0-9a-fA-F-]{36})/g)];

          process.stdout.write(matches.at(-1)?.[1] || "");
          NODE
          )"

          test -n "$BUILD_ID" || {
            echo "Runner EAS build ID was not found." >&2
            exit 1
          }

          npx eas-cli@latest build:view "$BUILD_ID" \
            --json > "$RUNNER_TEMP/sami-runner-build.json"

          node - "$RUNNER_TEMP/sami-runner-build.json" <<'NODE'
          const fs = require("node:fs");

          const raw = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          const build = raw.build || raw;

          if (String(build.status).toUpperCase() !== "FINISHED") {
            throw new Error("Runner build did not finish successfully.");
          }

          if (String(build.platform).toUpperCase() !== "ANDROID") {
            throw new Error("Runner build is not Android.");
          }

          if (build.appIdentifier !== "com.sami.runner") {
            throw new Error("Build does not belong to Runner.");
          }

          if (build.buildProfile !== "production") {
            throw new Error("Runner build is not production.");
          }

          if (!build.artifacts?.applicationArchiveUrl) {
            throw new Error("Runner APK artifact is missing.");
          }

          console.log("Runner production APK build verified.");
          NODE

          npx eas-cli@latest build:download \
            --build-id "$BUILD_ID" \
            --non-interactive

          APK_PATH="$(
            find /tmp/runner/eas-cli-nodejs/eas-build-run-cache \
              -maxdepth 4 -type f -iname '*.apk' \
              -print -quit 2>/dev/null || true
          )"

          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(
              find . -maxdepth 6 -type f -iname '*.apk' \
                -not -path '*/node_modules/*' \
                -print -quit
            )"
          fi

          test -n "$APK_PATH" && test -s "$APK_PATH" || {
            echo "Runner APK download failed." >&2
            exit 1
          }

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" -name apksigner \
              -print 2>/dev/null | sort -V | tail -n 1
          )"

          test -n "$APKSIGNER" || {
            echo "Android apksigner was not found." >&2
            exit 1
          }

          "$APKSIGNER" verify "$APK_PATH"

          mkdir -p "$RUNNER_TEMP/sami-runner-release"

          cp "$APK_PATH" \
            "$RUNNER_TEMP/sami-runner-release/SaMi-Runner-production.apk"

          sha256sum \
            "$RUNNER_TEMP/sami-runner-release/SaMi-Runner-production.apk" \
            > "$RUNNER_TEMP/sami-runner-release/SHA256SUMS.txt"

          echo "Runner EAS build: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner package: com.sami.runner" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner update channel: runner-production" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner APK signature verification: passed" >> "$GITHUB_STEP_SUMMARY"

          cat "$RUNNER_TEMP/sami-runner-release/SHA256SUMS.txt" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Runner production APK
        uses: actions/upload-artifact@v4
        with:
          name: sami-runner-production-apk
          path: ${{ runner.temp }}/sami-runner-release/SaMi-Runner-production.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Runner APK checksum
        uses: actions/upload-artifact@v4
        with:
          name: sami-runner-apk-checksum
          path: ${{ runner.temp }}/sami-runner-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
