name: SaMi production APK delivery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sami-production-apk-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-production-apk-delivery
  cancel-in-progress: false

jobs:
  deliver-production-apk:
    name: Download and publish the signed production APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app
      EXPO_UPDATE_CHANNEL: production
      TARGET_EXISTING_SHA: f2ae9a8be7518928fc25adde25b06d73ee6b4098

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Validate production project and app identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is missing from GitHub Actions secrets." >&2; exit 1; }
          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d" || { echo "EXPO_PROJECT_ID does not point to SaMi production." >&2; exit 1; }
          node - <<'NODE'
          const fs = require("node:fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
          const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          if (app.android?.package !== "com.sami.errands") throw new Error("Wrong Android package ID.");
          if (app.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) throw new Error("Wrong Expo project ID.");
          if (eas.build?.production?.channel !== "production") throw new Error("Wrong EAS production channel.");
          if (eas.build?.production?.android?.buildType !== "apk") throw new Error("Production build must deliver an APK.");
          if (eas.build?.production?.env?.EXPO_PUBLIC_SAMI_API_URL !== "https://sami-assist.vercel.app") throw new Error("Production build must use the live SaMi API.");
          NODE

      - name: Reuse the active production build or trigger one if absent
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          export DELIVERY_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_LIST="$(npx --yes eas-cli@latest build:list --platform android --build-profile production --limit 25 --json --non-interactive)"
          printf '%s' "$BUILD_LIST" > "$RUNNER_TEMP/sami-eas-build-list.json"
          BUILD_ID="$(node - "$RUNNER_TEMP/sami-eas-build-list.json" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const builds = Array.isArray(data) ? data : (data.builds || data.data || data.items || []);
          const now = Date.now();
          const active = new Set(["new", "in-queue", "in_progress", "in-progress", "pending-cancel"]);
          const asTime = value => typeof value === "number" ? value : Date.parse(value || "") || 0;
          const eligible = builds.filter(b => {
            if (String(b.platform || "").toLowerCase() !== "android") return false;
            const profile = b.buildProfile || b.profile || b.build_profile;
            if (profile && profile !== "production") return false;
            const status = String(b.status || "").toLowerCase();
            const created = asTime(b.createdAt || b.created_at);
            return b.gitCommitHash === process.env.TARGET_EXISTING_SHA ||
              (active.has(status) && created > now - 60 * 60 * 1000);
          }).sort((a, b) => asTime(b.createdAt || b.created_at) - asTime(a.createdAt || a.created_at));
          process.stdout.write(eligible[0]?.id || "");
          NODE
          )"

          if [[ -z "$BUILD_ID" ]]; then
            echo "No matching active production build exists; starting one against the production profile."
            BUILD_JSON="$(npx --yes eas-cli@latest build --platform android --profile production --non-interactive --no-wait --json --message "SaMi production APK delivery")"
            printf '%s' "$BUILD_JSON" > "$RUNNER_TEMP/sami-eas-new-build.json"
            BUILD_ID="$(node - "$RUNNER_TEMP/sami-eas-new-build.json" <<'NODE'
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const builds = Array.isArray(data) ? data : (data.builds || data.data || data.items || []);
            const build = data.id ? data : builds[0];
            process.stdout.write(build?.id || "");
            NODE
            )"
            if [[ -z "$BUILD_ID" ]]; then
              for attempt in $(seq 1 6); do
                sleep 10
                BUILD_LIST="$(npx --yes eas-cli@latest build:list --platform android --build-profile production --limit 10 --json --non-interactive)"
                printf '%s' "$BUILD_LIST" > "$RUNNER_TEMP/sami-eas-build-list.json"
                BUILD_ID="$(node - "$RUNNER_TEMP/sami-eas-build-list.json" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const builds = Array.isArray(data) ? data : (data.builds || data.data || data.items || []);
          const started = Date.parse(process.env.DELIVERY_STARTED_AT || "") || Date.now() - 120000;
          const candidates = builds.filter(b =>
            String(b.platform || "").toLowerCase() === "android" &&
            (!b.buildProfile || b.buildProfile === "production") &&
            (Date.parse(b.createdAt || b.created_at || "") || 0) >= started
          ).sort((a,b) => (Date.parse(b.createdAt || b.created_at || "") || 0) - (Date.parse(a.createdAt || a.created_at || "") || 0));
          process.stdout.write(candidates[0]?.id || "");
          NODE
          )"
                [[ -n "$BUILD_ID" ]] && break
              done
            fi
          fi

          test -n "$BUILD_ID" || { echo "Could not identify the EAS production build ID." >&2; exit 1; }
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "EAS production build ID: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Production API: https://sami-assist.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "Android package: com.sami.errands" >> "$GITHUB_STEP_SUMMARY"
          echo "Update channel: production" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the selected EAS build and download the APK
        shell: bash
        env:
          BUILD_ID: ${{ steps.eas.outputs.build_id }}
        run: |
          set -euo pipefail
          BUILD_STATUS=""
          for attempt in $(seq 1 120); do
            BUILD_LIST="$(npx --yes eas-cli@latest build:list --platform android --build-profile production --limit 25 --json --non-interactive)"
            printf '%s' "$BUILD_LIST" > "$RUNNER_TEMP/sami-eas-build-list.json"
            RESULT="$(node - "$RUNNER_TEMP/sami-eas-build-list.json" "$BUILD_ID" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const id = process.argv[3];
          const builds = Array.isArray(data) ? data : (data.builds || data.data || data.items || []);
          const build = builds.find(b => b.id === id);
          if (!build) {
            console.log("missing|");
          } else {
            console.log(String(build.status || "unknown").toLowerCase() + "|" + (build.status === "FINISHED" || String(build.status).toLowerCase() === "finished" ? (build.artifacts?.applicationArchiveUrl || "") : ""));
          }
          NODE
          )"
            BUILD_STATUS="${RESULT%%|*}"
            echo "EAS build status check $attempt/120: $BUILD_STATUS"
            case "$BUILD_STATUS" in
              finished)
                npx --yes eas-cli@latest build:download --build-id "$BUILD_ID" --non-interactive
                APK_PATH="$(find . -maxdepth 5 -type f -iname '*.apk' -not -path '*/node_modules/*' -print -quit)"
                if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
                  echo "EAS reported a finished build but no APK was downloaded." >&2
                  exit 1
                fi
                cp "$APK_PATH" "$RUNNER_TEMP/SaMi-production.apk"
                test -s "$RUNNER_TEMP/SaMi-production.apk"
                echo "APK file: SaMi-production.apk" >> "$GITHUB_STEP_SUMMARY"
                echo "APK size: $(stat -c%s "$RUNNER_TEMP/SaMi-production.apk") bytes" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              errored|canceled|cancelled)
                echo "EAS production build ended with status: $BUILD_STATUS" >&2
                echo "Open the EAS build details from the GitHub Actions log to inspect the failure." >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for EAS build $BUILD_ID to finish." >&2
          exit 1

      - name: Upload the production APK download
        uses: actions/upload-artifact@v4
        with:
          name: sami-production-android-apk
          path: ${{ runner.temp }}/SaMi-production.apk
          if-no-files-found: error
          retention-days: 30
