name: CRM Module Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/apps/crm/**'
      - 'app/api/apps/crm/**'
      - 'lib/apps/crm/**'
      - 'lib/apps/enterprise/**'
      - 'tests/crm-sales-integration.test.mjs'
      - '.github/workflows/crm-module.yml'
  push:
    branches:
      - main
    paths:
      - 'app/apps/crm/**'
      - 'app/api/apps/crm/**'
      - 'lib/apps/crm/**'
      - 'lib/apps/enterprise/**'
      - 'tests/crm-sales-integration.test.mjs'
      - '.github/workflows/crm-module.yml'

permissions:
  contents: read

concurrency:
  group: crm-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm:
    name: Validate CRM integration and timeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CRM integration contract tests
        run: node --test tests/crm-sales-integration.test.mjs

      - name: TypeScript
        run: npx tsc --noEmit
