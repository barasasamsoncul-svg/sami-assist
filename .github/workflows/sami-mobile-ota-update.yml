name: SaMi mobile OTA updates

on:
  push:
    branches:
      - feat/sami-native-app
      - main
    paths:
      - "apps/mobile/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-mobile-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-update:
    name: Publish compatible app update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_UPDATE_CHANNEL: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      EXPO_EAS_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      EXPO_PUBLIC_SAMI_API_URL: ${{ github.ref_name == 'main' && 'https://sami-assist.vercel.app' || 'https://sami-assist-git-feat-sami-2bf3a4-barasasamsoncul-svgs-projects.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Publish OTA update
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: >
          npx eas-cli@latest update
          --channel "$EXPO_UPDATE_CHANNEL"
          --message "Automated SaMi update ${GITHUB_SHA}"
          --environment "$EXPO_EAS_ENVIRONMENT"
          --non-interactive

      - name: Explain why publishing was skipped
        if: ${{ env.EXPO_TOKEN == '' || env.EXPO_PROJECT_ID == '' }}
        run: |
          {
            echo "### OTA update not published"
            echo
            echo "Set the GitHub repository variable `EXPO_PROJECT_ID` and secret `EXPO_TOKEN` after linking the mobile app to an Expo project."
            echo "This workflow will then publish compatible mobile code changes automatically."
          } >> "$GITHUB_STEP_SUMMARY"
