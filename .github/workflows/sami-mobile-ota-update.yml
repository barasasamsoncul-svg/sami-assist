
name: SaMi Production Releases

on:
  push:
    branches:
      - feat/sami-native-app
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/sami-mobile-ota-update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-production-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish SaMi Production Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub secret EXPO_TOKEN is missing."
            exit 1
          fi

      - name: Select release type
        id: release
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[build-aab]"* ]]; then
            echo "mode=aab" >> "$GITHUB_OUTPUT"
          else
            echo "mode=ota" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish production OTA update
        if: steps.release.outputs.mode == 'ota'
        run: >
          npx eas-cli@latest update
          --channel production
          --message "SaMi production OTA ${GITHUB_SHA}"
          --environment production
          --platform android
          --non-interactive

      - name: Build production Android AAB
        if: steps.release.outputs.mode == 'aab'
        run: >
          npx eas-cli@latest build
          --platform android
          --profile production
          --non-interactive
          --no-wait

