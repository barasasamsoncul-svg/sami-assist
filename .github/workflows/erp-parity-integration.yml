name: ERP Parity Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: erp-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Validate ERP transaction chain
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sami
          POSTGRES_PASSWORD: sami
          POSTGRES_DB: sami_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sami -d sami_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://sami:sami@127.0.0.1:5432/sami_erp_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL ERP integration proof
        run: npm run test:erp-integration
