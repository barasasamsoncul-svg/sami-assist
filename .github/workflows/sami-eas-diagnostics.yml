name: SaMi EAS failed-build diagnostics # refresh6

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sami-eas-diagnostics.yml"

permissions:
  contents: read

jobs:
  inspect-failed-build:
    name: Collect EAS build details and available logs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies for Expo config resolution
        run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Inspect latest production EAS build and collect available logs
        shell: bash
        env:
          TARGET_SHA: a1a407beade65cde2d684a30ffd8ccd0ebddcd2a
        run: |
          set -euo pipefail
          DIAG="$RUNNER_TEMP/sami-eas-diagnostics"
          mkdir -p "$DIAG/download"
          eas build:list --platform android --build-profile production --limit 20 --json --non-interactive > "$DIAG/build-list.json"
          BUILD_ID="$(node - "$DIAG/build-list.json" "$TARGET_SHA" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const target = process.argv[3];
          const builds = Array.isArray(data) ? data : (data.builds || data.data || data.items || []);
          const date = b => Date.parse(b.createdAt || b.created_at || "") || 0;
          const exact = builds.filter(b => b.gitCommitHash === target).sort((a,b) => date(b)-date(a));
          const selected = exact[0] || builds.sort((a,b) => date(b)-date(a))[0];
          process.stdout.write(selected?.id || "");
          NODE
          )"
          test -n "$BUILD_ID" || { echo "No production EAS build found." >&2; exit 1; }
          echo "$BUILD_ID" > "$DIAG/build-id.txt"
          eas build:view "$BUILD_ID" --json > "$DIAG/build-raw.json"
          node - "$DIAG/build-raw.json" "$DIAG/build-summary.json" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const build = data.build || data;
          const safe = {
            id: build.id,
            status: build.status,
            platform: build.platform,
            buildProfile: build.buildProfile,
            gitCommitHash: build.gitCommitHash,
            createdAt: build.createdAt,
            completedAt: build.completedAt,
            error: build.error,
            logFileCount: Array.isArray(build.logFiles) ? build.logFiles.length : 0,
            artifacts: build.artifacts || {}
          };
          fs.writeFileSync(process.argv[3], JSON.stringify(safe, null, 2));
          const log = Array.isArray(build.logFiles) ? build.logFiles[0] : null;
          fs.writeFileSync(process.argv[3] + ".url", log || "");
          console.log(JSON.stringify(safe, null, 2));
          NODE
          LOG_URL="$(cat "$DIAG/build-summary.json.url")"
          if [[ -n "$LOG_URL" ]]; then
            curl --fail --silent --show-error --location "$LOG_URL" --output "$DIAG/download/build-log.br"
            node - "$DIAG/download/build-log.br" "$DIAG/download/build-log.jsonl" <<'NODE'
          const fs = require("node:fs");
          const zlib = require("node:zlib");
          fs.writeFileSync(process.argv[3], zlib.brotliDecompressSync(fs.readFileSync(process.argv[2])));
          NODE
            node - "$DIAG/download/build-log.jsonl" "$DIAG/download/build-log.txt" <<'NODE'
          const fs = require("node:fs");
          const rows = fs.readFileSync(process.argv[2], "utf8").split(/\r?\n/).filter(Boolean);
          const out = [];
          for (const line of rows) {
            try {
              const o = JSON.parse(line);
              out.push(`${o.time || ""} [${o.phase || ""}] ${o.source || "stdout"}: ${o.msg || ""}`);
            } catch {
              out.push(line);
            }
          }
          fs.writeFileSync(process.argv[3], out.join("\n"));
          console.log(out.filter(l => /INSTALL_DEPENDENCIES|npm error|ERESOLVE|FAIL|ERROR/i.test(l)).slice(-100).join("\n"));
          NODE
            rm -f "$DIAG/download/build-log.br" "$DIAG/build-summary.json.url"
          fi
          rm -f "$DIAG/build-raw.json" "$DIAG/build-list.json"
          echo "EAS build: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: $(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).status' "$DIAG/build-summary.json")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EAS failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sami-eas-failure-diagnostics
          path: ${{ runner.temp }}/sami-eas-diagnostics/
          if-no-files-found: warn
          retention-days: 7
