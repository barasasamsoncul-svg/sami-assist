
name: SaMi Runner checks

on:
  push:
    branches:
      - main
    paths:
      - "apps/runner/**"
      - "app/api/runner/**"
      - "tsconfig.json"
      - ".github/workflows/sami-runner-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/runner/**"
      - "app/api/runner/**"
      - "tsconfig.json"
      - ".github/workflows/sami-runner-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-mobile:
    name: Runner mobile export, type-check, and native prebuild
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package.json

      - name: Install Runner mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Expo Router route types and export Android bundle
        run: npx expo export --platform android --output-dir .expo/ci-export

      - name: Type-check Runner mobile app
        run: npx tsc --noEmit

      - name: Generate Android and iOS native projects with CNG
        run: npx expo prebuild --no-install

      - name: Verify generated SaMi Mapbox native configuration
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");

          // withProjectBuildGradle writes to android/build.gradle.
          const projectGradle = fs.readFileSync("android/build.gradle", "utf8");
          const appGradle = fs.readFileSync("android/app/build.gradle", "utf8");
          const podfile = fs.readFileSync("ios/Podfile", "utf8");
          const podspec = fs.readFileSync(
            "modules/sami-mapbox/ios/SaMiMapbox.podspec",
            "utf8"
          );

          assert.ok(
            projectGradle.includes(
              "https://api.mapbox.com/downloads/v2/releases/maven"
            ),
            "Mapbox authenticated Maven repository is missing from android/build.gradle"
          );

          assert.ok(
            projectGradle.includes(
              "SaMi Mapbox Maven configuration"
            ),
            "SaMi Mapbox Maven configuration marker is missing"
          );

          assert.ok(
            appGradle.includes('ndkVersion "27.1.12297006"'),
            "Android NDK 27 pin is missing"
          );

          assert.ok(
            podfile.includes("# @generated begin SaMi Mapbox iOS SPM integration"),
            "SaMi iOS Podfile integration was not generated"
          );

          assert.ok(
            podfile.includes("[SaMi] Embed Mapbox SPM Frameworks"),
            "SaMi Mapbox SPM framework embedding phase is missing"
          );

          assert.ok(
            podspec.includes("MapboxNavigationCore") &&
              podspec.includes("MapboxMaps"),
            "Official Mapbox iOS SDK products are missing from the podspec"
          );

          assert.ok(
            !podspec.includes("embed_frameworks:"),
            "Do not use the newer embed_frameworks keyword with React Native 0.88.1"
          );

          console.log(
            "SaMi Mapbox Android and iOS native configuration verified."
          );
          NODE

          ruby -c ios/Podfile
          ruby -c modules/sami-mapbox/ios/SaMiMapbox.podspec

  shared-vercel-app:
    name: Shared SaMi Next.js build (includes Runner API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install shared application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run shared tests and build
        run: npm run build
