name: SaMi Runner checks

on:
  push:
    branches:
      - main
    paths:
      - "apps/runner/**"
      - "app/api/runner/**"
      - "tsconfig.json"
      - ".github/workflows/sami-runner-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/runner/**"
      - "app/api/runner/**"
      - "tsconfig.json"
      - ".github/workflows/sami-runner-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-mobile:
    name: Runner mobile export and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package.json
      - name: Install Runner mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Expo Router route types and export Android bundle
        run: npx expo export --platform android --output-dir .expo/ci-export
      - name: Type-check Runner mobile app
        run: npx tsc --noEmit

  shared-vercel-app:
    name: Shared SaMi Next.js build (includes Runner API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install shared application dependencies
        run: npm ci --no-audit --no-fund
      - name: Run shared tests and build
        run: npm run build
