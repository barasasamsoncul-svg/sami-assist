
name: SaMi production OTA updates

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/components/**"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - ".github/workflows/sami-production-ota.yml"
      - "!apps/mobile/assets/icon.png"
      - "!apps/mobile/assets/adaptive-icon.png"
      - "!apps/mobile/assets/sami-app-icon-1024.png"
      - "!apps/mobile/assets/sami-splash-logo-1024.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-production-ota
  cancel-in-progress: true

jobs:
  detect-native-changes:
    name: Detect native changes before OTA
    runs-on: ubuntu-latest
    outputs:
      native_changes: ${{ steps.classify.outputs.native_changes }}

    steps:
      - name: Checkout complete commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify pushed changes
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          AFTER="$GITHUB_SHA"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual OTA publication is restricted to main."
            echo "native_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
          else
            BEFORE="${{ github.event.before }}"
          fi

          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "Cannot establish a safe commit comparison. Skipping OTA."
            echo "native_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous commit is unavailable. Skipping OTA for safety."
            echo "native_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BEFORE" "$AFTER")"

          echo "Files included in this release:"
          printf '%s\n' "$CHANGED_FILES"

          NATIVE_CHANGE=false

          while IFS= read -r file; do
            case "$file" in
              apps/mobile/app.json|\
              apps/mobile/app.config.ts|\
              apps/mobile/eas.json|\
              apps/mobile/package.json|\
              apps/mobile/package-lock.json|\
              apps/mobile/assets/icon.png|\
              apps/mobile/assets/adaptive-icon.png|\
              apps/mobile/assets/sami-app-icon-1024.png|\
              apps/mobile/assets/sami-splash-logo-1024.png|\
              apps/mobile/plugins/*|\
              apps/mobile/android/*|\
              apps/mobile/ios/*)
                NATIVE_CHANGE=true
                echo "Native change detected: $file"
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "native_changes=$NATIVE_CHANGE" >> "$GITHUB_OUTPUT"

          if [[ "$NATIVE_CHANGE" == "true" ]]; then
            echo "Native changes detected. The production APK workflow handles this release. OTA will be skipped."
          else
            echo "No native changes detected. OTA publication is eligible."
          fi

  publish-production-update:
    name: Validate and publish compatible Android update
    needs: detect-native-changes
    if: needs.detect-native-changes.outputs.native_changes != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app
      EXPO_UPDATE_CHANNEL: production

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate production update target
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is missing from GitHub Actions secrets." >&2; exit 1; }

          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d" || {
            echo "EXPO_PROJECT_ID must point to the SaMi production Expo project." >&2
            exit 1
          }

          npx expo config --type public --json > "$RUNNER_TEMP/sami-production-expo-config.json"

          node - "$RUNNER_TEMP/sami-production-expo-config.json" <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));

          if (config.android?.package !== "com.sami.errands") {
            throw new Error("Unexpected Android package identity.");
          }

          if (config.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) {
            throw new Error("Expo project ID does not match production.");
          }

          if (config.updates?.enabled !== true) {
            throw new Error("EAS Updates are not enabled.");
          }

          if (config.updates?.url !== "https://u.expo.dev/" + process.env.EXPO_PROJECT_ID) {
            throw new Error("EAS Updates URL does not match production.");
          }

          if (config.updates?.requestHeaders?.["expo-channel-name"] !== "production") {
            throw new Error("The app is not configured for the production update channel.");
          }

          if (config.runtimeVersion?.policy !== "fingerprint") {
            throw new Error("OTA updates require fingerprint runtime compatibility.");
          }
          NODE

      - name: Check Expo SDK dependency compatibility without changing native packages
        shell: bash
        run: |
          if ! npx expo install --check; then
            echo "::warning::The committed dependency versions differ from the latest Expo patch recommendations. They are intentionally not auto-upgraded in OTA CI because changing native package versions changes the runtime fingerprint and can make this update incompatible with the installed APK."
          fi

      - name: Type-check app
        run: npm run typecheck

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Verify production Android JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-production-ota-bundle"

      - name: Load restricted Google Maps key from EAS production environment
        shell: bash
        run: |
          set -euo pipefail

          MAP_ENV_FILE="$RUNNER_TEMP/sami-eas-production.env"

          npx eas-cli@latest env:pull --environment production --path "$MAP_ENV_FILE" --non-interactive

          node - "$MAP_ENV_FILE" "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const [envPath, githubEnv] = process.argv.slice(2);

          const line = fs.readFileSync(envPath, "utf8")
            .split(/\r?\n/)
            .find((item) => item.startsWith("GOOGLE_MAPS_API_KEY="));

          let key = line?.slice("GOOGLE_MAPS_API_KEY=".length).trim() || "";

          if (
            (key.startsWith('"') && key.endsWith('"')) ||
            (key.startsWith("'") && key.endsWith("'"))
          ) {
            key = key.slice(1, -1);
          }

          if (key.length < 20) {
            console.error("GOOGLE_MAPS_API_KEY is missing from EAS production variables or is not pullable. Add it in Expo > SaMi project > Environment variables as Sensitive, then rerun the update.");
            process.exit(1);
          }

          console.log("::add-mask::" + key);
          fs.appendFileSync(githubEnv, "GOOGLE_MAPS_API_KEY=" + key + "\n");
          fs.unlinkSync(envPath);

          console.log("Restricted Google Maps key loaded; value was not logged.");
          NODE

      - name: Verify OTA fingerprint matches the latest production APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_LIST="$RUNNER_TEMP/sami-production-build-list.json"
          FINGERPRINT_COMPARE="$RUNNER_TEMP/sami-production-fingerprint-compare.json"

          npx eas-cli@latest build:list \
            --platform android \
            --build-profile production \
            --channel production \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive > "$BUILD_LIST"

          BUILD_ID="$(node - "$BUILD_LIST" <<'NODE'
          const fs = require("node:fs");
          const parsed = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const builds = Array.isArray(parsed)
            ? parsed
            : parsed.builds ?? parsed.data ?? parsed.items ?? [];
          const finished = builds
            .filter((build) => String(build.status ?? "").toUpperCase() === "FINISHED")
            .sort((a, b) => Date.parse(b.createdAt ?? b.created_at ?? 0) - Date.parse(a.createdAt ?? a.created_at ?? 0));
          process.stdout.write(finished[0]?.id ?? "");
          NODE
          )"

          test -n "$BUILD_ID" || {
            echo "No finished production Android APK was found on the production channel." >&2
            exit 1
          }

          echo "Checking runtime compatibility against production APK: $BUILD_ID"

          npx eas-cli@latest fingerprint:compare \
            --build-id "$BUILD_ID" \
            --environment production \
            --json \
            --non-interactive > "$FINGERPRINT_COMPARE"

          node - "$FINGERPRINT_COMPARE" "$BUILD_ID" <<'NODE'
          const fs = require("node:fs");
          const [file, buildId] = process.argv.slice(2);
          const comparison = JSON.parse(fs.readFileSync(file, "utf8"));
          const hashes = ["fingerprint1", "fingerprint2"]
            .map((key) => comparison[key]?.hash)
            .filter(Boolean);

          if (hashes.length !== 2) {
            throw new Error("EAS fingerprint comparison did not return both the production APK and current project fingerprints.");
          }

          if (hashes[0] !== hashes[1]) {
            console.error("The current OTA project fingerprint does not match the latest production APK.");
            console.error("APK/project comparison: " + hashes.join(" vs "));
            console.error("Refusing to publish an OTA update that the installed production APK cannot receive.");
            process.exit(1);
          }

          console.log("Runtime compatibility verified for production APK " + buildId + ".");
          console.log("Both fingerprints: " + hashes[0]);
          NODE

      - name: Publish compatible production Android update
        run: >
          npx eas-cli@latest update
          --environment production
          --channel production
          --platform android
          --message "SaMi production update ${GITHUB_SHA}"
          --non-interactive
