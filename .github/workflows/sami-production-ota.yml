name: SaMi production OTA updates

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/components/**"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - "!apps/mobile/assets/icon.png"
      - "!apps/mobile/assets/adaptive-icon.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-production-ota
  cancel-in-progress: true

jobs:
  publish-production-update:
    name: Validate and publish compatible Android update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app
      EXPO_UPDATE_CHANNEL: production

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund


      - name: Validate production update target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is missing from GitHub Actions secrets." >&2; exit 1; }
          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d" || { echo "EXPO_PROJECT_ID must point to the SaMi production Expo project." >&2; exit 1; }
          npx expo config --type public --json > "$RUNNER_TEMP/sami-production-expo-config.json"
          node - "$RUNNER_TEMP/sami-production-expo-config.json" <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (config.android?.package !== "com.sami.errands") throw new Error("Unexpected Android package identity.");
          if (config.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) throw new Error("Expo project ID does not match production.");
          if (config.updates?.enabled !== true) throw new Error("EAS Updates are not enabled.");
          if (config.updates?.url !== "https://u.expo.dev/" + process.env.EXPO_PROJECT_ID) throw new Error("EAS Updates URL does not match production.");
          if (config.updates?.requestHeaders?.["expo-channel-name"] !== "production") throw new Error("The app is not configured for the production update channel.");
          if (config.runtimeVersion?.policy !== "fingerprint") throw new Error("OTA updates require fingerprint runtime compatibility.");
          NODE

      - name: Check Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Type-check app
        run: npm run typecheck

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Verify production Android JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-production-ota-bundle"

      - name: Load restricted Google Maps key from EAS production environment
        shell: bash
        run: |
          set -euo pipefail
          MAP_ENV_FILE="$RUNNER_TEMP/sami-eas-production.env"
          npx eas-cli@latest env:pull --environment production --path "$MAP_ENV_FILE" --non-interactive
          node - "$MAP_ENV_FILE" "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const [envPath, githubEnv] = process.argv.slice(2);
          const line = fs.readFileSync(envPath, "utf8").split(/\r?\n/).find((item) => item.startsWith("GOOGLE_MAPS_API_KEY="));
          let key = line?.slice("GOOGLE_MAPS_API_KEY=".length).trim() || "";
          if ((key.startsWith('"') && key.endsWith('"')) || (key.startsWith("'") && key.endsWith("'"))) key = key.slice(1, -1);
          if (key.length < 20) {
            console.error("GOOGLE_MAPS_API_KEY is missing from EAS production variables or is not pullable. Add it in Expo > SaMi project > Environment variables as Sensitive, then rerun the build.");
            process.exit(1);
          }
          console.log("::add-mask::" + key);
          fs.appendFileSync(githubEnv, "GOOGLE_MAPS_API_KEY=" + key + "\n");
          fs.unlinkSync(envPath);
          console.log("Restricted Google Maps key loaded for native config; value was not logged.");
          NODE

      - name: Publish compatible production Android update
        run: >
          npx eas-cli@latest update
          --environment production
          --channel production
          --platform android
          --message "SaMi production update ${GITHUB_SHA}"
          --non-interactive
