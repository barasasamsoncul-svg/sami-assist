name: SaMi production OTA updates

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/components/**"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - "apps/runner/app/**"
      - "apps/runner/components/**"
      - "apps/runner/src/**"
      - "apps/runner/assets/**"
      - "!apps/mobile/assets/icon.png"
      - "!apps/mobile/assets/adaptive-icon.png"
      - "!apps/mobile/assets/sami-app-icon-1024.png"
      - "!apps/mobile/assets/sami-splash-logo-1024.png"
      - "!apps/runner/assets/icon.png"
      - "!apps/runner/assets/adaptive-icon.png"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sami-production-ota
  cancel-in-progress: true

jobs:
  detect-release-changes:
    name: Decide which apps qualify for OTA
    runs-on: ubuntu-latest

    outputs:
      customer_changed: ${{ steps.classify.outputs.customer_changed }}
      customer_native: ${{ steps.classify.outputs.customer_native }}
      runner_changed: ${{ steps.classify.outputs.runner_changed }}
      runner_native: ${{ steps.classify.outputs.runner_native }}

    steps:
      - name: Checkout complete commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify Customer and Runner changes
        id: classify
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          AFTER="$GITHUB_SHA"

          CUSTOMER_CHANGED=false
          CUSTOMER_NATIVE=false
          RUNNER_CHANGED=false
          RUNNER_NATIVE=false

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "OTA publication is restricted to main."
            CUSTOMER_NATIVE=true
            RUNNER_NATIVE=true
          else
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
            else
              BEFORE="$EVENT_BEFORE"
            fi

            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || \
              ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "Cannot establish a safe commit comparison."
              echo "OTA will be skipped for both applications."
              CUSTOMER_NATIVE=true
              RUNNER_NATIVE=true
            else
              CHANGED_FILES="$(git diff --name-only "$BEFORE" "$AFTER")"

              echo "Files included in this release:"
              printf '%s\n' "$CHANGED_FILES"

              while IFS= read -r file; do
                [[ -n "$file" ]] || continue

                case "$file" in
                  apps/mobile/app/*|\
                  apps/mobile/components/*|\
                  apps/mobile/src/*|\
                  apps/mobile/assets/*|\
                  apps/mobile/app.json|\
                  apps/mobile/app.config.ts|\
                  apps/mobile/eas.json|\
                  apps/mobile/package.json|\
                  apps/mobile/package-lock.json|\
                  apps/mobile/plugins/*|\
                  apps/mobile/android/*|\
                  apps/mobile/ios/*)
                    CUSTOMER_CHANGED=true
                    ;;
                esac

                case "$file" in
                  apps/runner/app/*|\
                  apps/runner/components/*|\
                  apps/runner/src/*|\
                  apps/runner/assets/*|\
                  apps/runner/app.json|\
                  apps/runner/eas.json|\
                  apps/runner/package.json|\
                  apps/runner/package-lock.json|\
                  apps/runner/plugins/*|\
                  apps/runner/android/*|\
                  apps/runner/ios/*)
                    RUNNER_CHANGED=true
                    ;;
                esac

                case "$file" in
                  apps/mobile/app.json|\
                  apps/mobile/app.config.ts|\
                  apps/mobile/eas.json|\
                  apps/mobile/package.json|\
                  apps/mobile/package-lock.json|\
                  apps/mobile/assets/icon.png|\
                  apps/mobile/assets/adaptive-icon.png|\
                  apps/mobile/assets/sami-app-icon-1024.png|\
                  apps/mobile/assets/sami-splash-logo-1024.png|\
                  apps/mobile/plugins/*|\
                  apps/mobile/android/*|\
                  apps/mobile/ios/*)
                    CUSTOMER_NATIVE=true
                    echo "Customer native change: $file"
                    ;;
                esac

                case "$file" in
                  apps/runner/app.json|\
                  apps/runner/eas.json|\
                  apps/runner/package.json|\
                  apps/runner/package-lock.json|\
                  apps/runner/assets/icon.png|\
                  apps/runner/assets/adaptive-icon.png|\
                  apps/runner/plugins/*|\
                  apps/runner/android/*|\
                  apps/runner/ios/*)
                    RUNNER_NATIVE=true
                    echo "Runner native change: $file"
                    ;;
                esac
              done <<< "$CHANGED_FILES"
            fi
          fi

          echo "customer_changed=$CUSTOMER_CHANGED" >> "$GITHUB_OUTPUT"
          echo "customer_native=$CUSTOMER_NATIVE" >> "$GITHUB_OUTPUT"
          echo "runner_changed=$RUNNER_CHANGED" >> "$GITHUB_OUTPUT"
          echo "runner_native=$RUNNER_NATIVE" >> "$GITHUB_OUTPUT"

          echo "Customer changed: $CUSTOMER_CHANGED"
          echo "Customer native: $CUSTOMER_NATIVE"
          echo "Runner changed: $RUNNER_CHANGED"
          echo "Runner native: $RUNNER_NATIVE"

  publish-production-update:
    name: Publish Customer production OTA update
    needs: detect-release-changes
    if: >-
      needs.detect-release-changes.outputs.customer_changed == 'true' &&
      needs.detect-release-changes.outputs.customer_native != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/mobile

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app
      EXPO_UPDATE_CHANNEL: production

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Customer dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate Customer production update target
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EXPO_TOKEN" || {
            echo "EXPO_TOKEN is missing from GitHub Actions secrets." >&2
            exit 1
          }

          test "$EXPO_PROJECT_ID" = "c09e119e-8a6b-4a1e-a7c6-b85cfd4e330d" || {
            echo "EXPO_PROJECT_ID must point to the Customer Expo project." >&2
            exit 1
          }

          npx expo config --type public --json \
            > "$RUNNER_TEMP/sami-customer-expo-config.json"

          node - "$RUNNER_TEMP/sami-customer-expo-config.json" <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          if (config.android?.package !== "com.sami.errands") {
            throw new Error("Unexpected Customer Android package.");
          }

          if (config.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) {
            throw new Error("Customer Expo project ID mismatch.");
          }

          if (config.updates?.enabled !== true) {
            throw new Error("Customer EAS Updates are disabled.");
          }

          if (
            config.updates?.url !==
            "https://u.expo.dev/" + process.env.EXPO_PROJECT_ID
          ) {
            throw new Error("Customer EAS Updates URL mismatch.");
          }

          if (
            config.updates?.requestHeaders?.["expo-channel-name"] !==
            "production"
          ) {
            throw new Error("Customer production channel mismatch.");
          }

          if (config.runtimeVersion?.policy !== "fingerprint") {
            throw new Error("Customer must use fingerprint runtime compatibility.");
          }
          NODE

      - name: Check Customer Expo dependency compatibility
        shell: bash
        run: |
          if ! npx expo install --check; then
            echo "::warning::Pinned native dependency versions are not being automatically changed during OTA publication."
          fi

      - name: Type-check Customer app
        run: npm run typecheck

      - name: Check Customer Expo project health
        shell: bash
        run: |
          set -uo pipefail

          DOCTOR_LOG="$RUNNER_TEMP/sami-expo-doctor.log"
          DOCTOR_STATUS=0

          npx expo-doctor 2>&1 | tee "$DOCTOR_LOG" || DOCTOR_STATUS=$?

          if [[ "$DOCTOR_STATUS" -eq 0 ]]; then
            exit 0
          fi

          if grep -Fq "20/21 checks passed. 1 checks failed." "$DOCTOR_LOG" \
            && grep -Fq "Check that packages match versions required by installed Expo SDK" "$DOCTOR_LOG" \
            && grep -Fq "7 packages out of date." "$DOCTOR_LOG" \
            && grep -Fq "expo                ~57.0.32  57.0.31" "$DOCTOR_LOG" \
            && grep -Fq "expo-constants      ~57.0.23  57.0.22" "$DOCTOR_LOG" \
            && grep -Fq "expo-location       ~57.0.23  57.0.22" "$DOCTOR_LOG" \
            && grep -Fq "expo-router         ~57.0.30  57.0.29" "$DOCTOR_LOG" \
            && grep -Fq "expo-sharing        ~57.0.25  57.0.24" "$DOCTOR_LOG" \
            && grep -Fq "expo-splash-screen  ~57.0.11  57.0.10" "$DOCTOR_LOG" \
            && grep -Fq "expo-updates        ~57.0.27  57.0.26" "$DOCTOR_LOG"; then
            echo "::warning::Only the known pinned Customer production APK patch-version advisory was reported."
            exit 0
          fi

          echo "Expo Doctor reported an unexpected Customer app issue." >&2
          exit "$DOCTOR_STATUS"

      - name: Verify Customer Android JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-customer-ota-bundle"

      - name: Load restricted Customer Google Maps key
        shell: bash
        run: |
          set -euo pipefail

          MAP_ENV_FILE="$RUNNER_TEMP/sami-eas-production.env"

          npx eas-cli@latest env:pull \
            --environment production \
            --path "$MAP_ENV_FILE" \
            --non-interactive

          node - "$MAP_ENV_FILE" "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const [envPath, githubEnv] = process.argv.slice(2);

          const line = fs.readFileSync(envPath, "utf8")
            .split(/\r?\n/)
            .find((item) => item.startsWith("GOOGLE_MAPS_API_KEY="));

          let key = line?.slice("GOOGLE_MAPS_API_KEY=".length).trim() || "";

          if (
            (key.startsWith('"') && key.endsWith('"')) ||
            (key.startsWith("'") && key.endsWith("'"))
          ) {
            key = key.slice(1, -1);
          }

          if (key.length < 20) {
            console.error("Customer Google Maps key is missing from the EAS production environment.");
            process.exit(1);
          }

          console.log("::add-mask::" + key);
          fs.appendFileSync(githubEnv, "GOOGLE_MAPS_API_KEY=" + key + "\n");
          fs.unlinkSync(envPath);

          console.log("Customer Google Maps key loaded; value was not logged.");
          NODE

      - name: Verify Customer OTA fingerprint
        shell: bash
        run: |
          set -euo pipefail

          BUILD_LIST="$RUNNER_TEMP/sami-customer-build-list.json"
          FINGERPRINT_COMPARE="$RUNNER_TEMP/sami-customer-fingerprint-compare.json"

          npx eas-cli@latest build:list \
            --platform android \
            --build-profile production \
            --channel production \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive > "$BUILD_LIST"

          BUILD_ID="$(node - "$BUILD_LIST" <<'NODE'
          const fs = require("node:fs");
          const parsed = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          const builds = Array.isArray(parsed)
            ? parsed
            : parsed.builds ?? parsed.data ?? parsed.items ?? [];

          const finished = builds
            .filter((build) =>
              String(build.status ?? "").toUpperCase() === "FINISHED"
            )
            .sort((a, b) =>
              Date.parse(b.createdAt ?? b.created_at ?? 0) -
              Date.parse(a.createdAt ?? a.created_at ?? 0)
            );

          process.stdout.write(finished[0]?.id ?? "");
          NODE
          )"

          test -n "$BUILD_ID" || {
            echo "No finished Customer production Android APK was found." >&2
            exit 1
          }

          npx eas-cli@latest fingerprint:compare \
            --build-id "$BUILD_ID" \
            --environment production \
            --json \
            --non-interactive > "$FINGERPRINT_COMPARE"

          node - "$FINGERPRINT_COMPARE" "$BUILD_ID" <<'NODE'
          const fs = require("node:fs");
          const [file, buildId] = process.argv.slice(2);
          const raw = fs.readFileSync(file, "utf8");
          const start = raw.indexOf("{");
          const end = raw.lastIndexOf("}");

          if (start < 0 || end < start) {
            throw new Error("EAS Customer fingerprint comparison returned invalid JSON.");
          }

          const comparison = JSON.parse(raw.slice(start, end + 1));

          const hashes = ["fingerprint1", "fingerprint2"]
            .map((key) => comparison[key]?.hash)
            .filter(Boolean);

          if (hashes.length !== 2 || hashes[0] !== hashes[1]) {
            throw new Error(
              "Customer OTA fingerprint does not match its latest production APK."
            );
          }

          console.log("Customer APK runtime compatibility verified.");
          console.log("Build ID: " + buildId);
          console.log("Fingerprint: " + hashes[0]);
          NODE

      - name: Publish Customer production Android update
        run: >
          npx eas-cli@latest update
          --environment production
          --channel production
          --platform android
          --message "SaMi Customer production update ${GITHUB_SHA}"
          --non-interactive

  publish-runner-production-update:
    name: Publish Runner production OTA update
    needs: detect-release-changes
    if: >-
      needs.detect-release-changes.outputs.runner_changed == 'true' &&
      needs.detect-release-changes.outputs.runner_native != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/runner

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: "8fcd647e-3514-4436-b1ce-c1b417f6c1d3"
      EXPO_PUBLIC_SAMI_API_URL: https://sami-assist.vercel.app

    steps:
      - name: Checkout Runner source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json

      - name: Install Runner dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate Runner production update target
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EXPO_TOKEN" || {
            echo "EXPO_TOKEN is missing from GitHub Actions secrets." >&2
            exit 1
          }

          npx expo config --type public --json \
            > "$RUNNER_TEMP/sami-runner-expo-config.json"

          node - "$RUNNER_TEMP/sami-runner-expo-config.json" <<'NODE'
          const fs = require("node:fs");

          const config = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          const eas = JSON.parse(
            fs.readFileSync("eas.json", "utf8")
          );

          const expectedProjectId =
            "8fcd647e-3514-4436-b1ce-c1b417f6c1d3";

          if (config.slug !== "sami-runner") {
            throw new Error("Incorrect Runner Expo slug.");
          }

          if (config.android?.package !== "com.sami.runner") {
            throw new Error("Incorrect Runner Android package.");
          }

          if (config.ios?.bundleIdentifier !== "com.sami.runner") {
            throw new Error("Incorrect Runner iOS bundle identifier.");
          }

          if (config.extra?.eas?.projectId !== expectedProjectId) {
            throw new Error("Runner EAS project ID mismatch.");
          }

          if (
            config.updates?.url !==
            "https://u.expo.dev/" + expectedProjectId
          ) {
            throw new Error("Runner EAS Updates URL mismatch.");
          }

          if (config.updates?.enabled !== true) {
            throw new Error("Runner EAS Updates are disabled.");
          }

          if (config.runtimeVersion?.policy !== "fingerprint") {
            throw new Error("Runner must use fingerprint runtime compatibility.");
          }

          if (eas.build?.production?.channel !== "runner-production") {
            throw new Error("Runner production build channel mismatch.");
          }

          if (eas.build?.production?.environment !== "production") {
            throw new Error("Runner production build must use production environment.");
          }

          if (eas.build?.production?.android?.buildType !== "apk") {
            throw new Error("Runner production profile must produce an APK.");
          }

          console.log("Runner Expo project verified.");
          console.log("Runner package: com.sami.runner");
          console.log("Runner channel: runner-production");
          console.log("Runner runtime policy: fingerprint");
          NODE

      - name: Check Runner Expo dependency compatibility
        run: npx expo install --check

      - name: Type-check Runner
        run: npm run typecheck

      - name: Check Runner Expo project health
        run: npx expo-doctor

      - name: Verify Runner Android JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sami-runner-ota-bundle"

      - name: Find latest finished Runner production APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_LIST="$RUNNER_TEMP/sami-runner-build-list.json"

          npx eas-cli@latest build:list \
            --platform android \
            --build-profile production \
            --channel runner-production \
            --status finished \
            --limit 10 \
            --json \
            --non-interactive > "$BUILD_LIST"

          node - "$BUILD_LIST" "$RUNNER_TEMP/sami-runner-build-id.txt" <<'NODE'
          const fs = require("node:fs");

          const raw = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          const builds = Array.isArray(raw)
            ? raw
            : raw.builds ?? raw.data ?? raw.items ?? [];

          const finished = builds
            .filter((build) =>
              String(build.status ?? "").toUpperCase() === "FINISHED" &&
              String(build.platform ?? "").toUpperCase() === "ANDROID" &&
              build.appIdentifier === "com.sami.runner" &&
              build.buildProfile === "production"
            )
            .sort((a, b) =>
              Date.parse(b.createdAt ?? b.created_at ?? 0) -
              Date.parse(a.createdAt ?? a.created_at ?? 0)
            );

          const build = finished[0];

          if (!build) {
            throw new Error(
              "No finished Runner production APK exists. Build the first Runner APK before publishing OTA updates."
            );
          }

          fs.writeFileSync(process.argv[3], build.id);

          console.log("Runner production APK found.");
          console.log("Build ID: " + build.id);
          console.log("Package: " + build.appIdentifier);
          NODE

      - name: Compare Runner OTA fingerprint with production APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ID="$(cat "$RUNNER_TEMP/sami-runner-build-id.txt")"
          FINGERPRINT_COMPARE="$RUNNER_TEMP/sami-runner-fingerprint-compare.json"

          npx eas-cli@latest fingerprint:compare \
            --build-id "$BUILD_ID" \
            --environment production \
            --json \
            --non-interactive > "$FINGERPRINT_COMPARE"

          node - "$FINGERPRINT_COMPARE" "$BUILD_ID" <<'NODE'
          const fs = require("node:fs");
          const [file, buildId] = process.argv.slice(2);

          const raw = fs.readFileSync(file, "utf8");
          const start = raw.indexOf("{");
          const end = raw.lastIndexOf("}");

          if (start < 0 || end < start) {
            throw new Error("EAS Runner fingerprint comparison returned invalid JSON.");
          }

          const comparison = JSON.parse(
            raw.slice(start, end + 1)
          );

          const hashes = ["fingerprint1", "fingerprint2"]
            .map((key) => comparison[key]?.hash)
            .filter(Boolean);

          if (hashes.length !== 2) {
            throw new Error("EAS did not return both Runner fingerprints.");
          }

          if (hashes[0] !== hashes[1]) {
            console.error("Runner OTA fingerprint mismatch.");
            console.error("APK/project comparison: " + hashes.join(" vs "));
            console.error(
              "A new Runner production APK is required before OTA publication."
            );
            process.exit(1);
          }

          console.log("Runner APK runtime compatibility verified.");
          console.log("Build ID: " + buildId);
          console.log("Fingerprint: " + hashes[0]);
          NODE

      - name: Publish Runner production Android update
        run: >
          npx eas-cli@latest update
          --environment production
          --channel runner-production
          --platform android
          --message "SaMi Runner production update ${GITHUB_SHA}"
          --non-interactive
