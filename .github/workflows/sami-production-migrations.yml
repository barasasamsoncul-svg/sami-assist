
name: SaMi Production Database Migrations

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: sami-production-database-migrations-${{ github.event.client_payload.id || github.sha }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Production database migrations
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.environment == 'production' &&
       github.event.client_payload.git.ref == 'main')

    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Notify Vercel that migrations are running
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - sami-assist: database-migrations"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the deployment commit
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/checkout@v1

      - name: Check out selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending database migrations
        run: npm run db:migrate
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
