name: Category 24 Platform Administration

on:
  push:
    branches:
      - feat/category-24-platform-administration
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: category-24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Category 24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Environment-independent platform regressions and production build
        run: npm run test:ci

      - name: TypeScript
        run: npx tsc --noEmit
