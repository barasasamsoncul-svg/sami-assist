name: Platform Kernel Closure

on:
  push:
    branches:
      - main
      - feat/platform-kernel-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  platform-kernel-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify platform kernel closure
        run: npm run test:platform-closure

      - name: Verify all standalone app surfaces
        run: npm run test:app-ui

      - name: TypeScript
        run: npx tsc --noEmit
